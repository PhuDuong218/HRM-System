
# ==============================
# Application
# ==============================
spring.application.name=hrm

# ==============================
# Local Profile
# ==============================
spring.profiles.active=local

# ==============================
# JWT Security
# ==============================
app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
# Thời gian không hoạt động tối đa của phiên web (giây).
app.security.web-idle-seconds=${WEB_IDLE_SECONDS:900}

# Gmail SMTP: set SMTP_USERNAME and SMTP_PASSWORD outside source control.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.recovery.mail-from=${SMTP_FROM:${SMTP_USERNAME:}}

# ==============================
# SQL Server
# ==============================
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# ==============================
# Server
# ==============================
server.port=2005
