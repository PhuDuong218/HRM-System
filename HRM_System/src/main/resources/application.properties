
# ==============================
# Application
# ==============================
spring.application.name=hrm

# ==============================
# Local Profile
# ==============================
spring.profiles.active=local

# ==============================
# JWT Security
# ==============================
app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
# Thời gian không hoạt động tối đa của phiên web (giây).
app.security.web-idle-seconds=${WEB_IDLE_SECONDS:900}

# Gmail SMTP: set SMTP_USERNAME and SMTP_PASSWORD outside source control.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.recovery.mail-from=${SMTP_FROM:${SMTP_USERNAME:}}

# ==============================
# SQL Server & HikariCP Pool
# ==============================
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=30000

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ==============================
# Server, Compression & Error Hardening
# ==============================
server.port=2005
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Approved allowance calculation policy
hrm.allowance.period-policy=CALENDAR_DAY_PRORATION
hrm.allowance.policy-version=ALLOWANCE-CALENDAR-DAYS-V1
