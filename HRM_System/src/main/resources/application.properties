spring.application.name=hrm

# Chú ý: Đã xóa chữ "integratedSecurity=true" ở dòng dưới
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=hrm_db;encrypt=false;trustServerCertificate=true

# Thêm 2 dòng này để đăng nhập bằng tài khoản sa
spring.datasource.username=sa
# Thay 123456 bằng đúng mật khẩu bạn vừa đặt nhé
spring.datasource.password=123456

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
server.port=2005