
spring.datasource.url=jdbc:h2:mem:hrm_test;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS dbo
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=dbo
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Test-only key; never used by the application runtime.
app.security.jwt-secret=test-only-HRM-2026-signing-key-not-for-runtime-0123456789
app.security.jwt-expiration-seconds=3600
